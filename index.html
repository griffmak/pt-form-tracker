<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PT Form Tracker</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 0;
        padding: 16px;
      }
      section {
        margin-bottom: 16px;
      }
      section h2 {
        font-size: 14px;
        text-transform: uppercase;
        color: #666;
        margin: 0 0 4px;
      }
      #replay-container {
        width: 640px;
        height: 480px;
        background: #111;
      }
      #progress-container {
        font-size: 16px;
      }
      #framing-instructions {
        font-size: 15px;
        font-weight: bold;
        background: #fffae0;
        border: 1px solid #ddd;
        padding: 8px 12px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <video id="camera-feed" autoplay playsinline muted style="display: none"></video>
      <section>
        <h2>Setup</h2>
        <div id="framing-instructions"></div>
      </section>
      <section>
        <h2>Live (press "e" to end session)</h2>
        <canvas id="overlay-canvas"></canvas>
      </section>
      <section>
        <h2>3D Replay</h2>
        <div id="replay-container"></div>
      </section>
      <section>
        <h2>Session Summary</h2>
        <div id="progress-container"></div>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
